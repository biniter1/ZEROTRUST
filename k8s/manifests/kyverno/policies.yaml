# ── POLICY 1: VERIFY IMAGE SIGNATURE ─────────────────────────
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-image-signature
  annotations:
    security.policy/standard: "SLSA-L3, NIST-800-207-T4"
spec:
  validationFailureAction: Enforce
  background: false
  failurePolicy: Fail
  rules:
    - name: check-image-signature
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [production]
      verifyImages:
        - imageReferences:
            - "*.dkr.ecr.ap-southeast-1.amazonaws.com/online-boutique/*"
          mutateDigest: true
          verifyDigest: true
          attestors:
            - entries:
                - keys:
                    kms: "awskms:///arn:aws:kms:ap-southeast-1:492462084314:key/b51a51ea-5064-424e-aaa9-458d2b4576dd"
        - imageReferences:
            - "*.dkr.ecr.ap-southeast-1.amazonaws.com/online-boutique/*"
          attestations:
            - type: https://cyclonedx.org/bom
              attestors:
                - entries:
                    - keys:
                        kms: "awskms:///arn:aws:kms:ap-southeast-1:492462084314:key/b51a51ea-5064-424e-aaa9-458d2b4576dd"
---
# ── POLICY 2: BLOCK MUTABLE TAGS ─────────────────────────────
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: block-mutable-tags
  annotations:
    security.policy/standard: "NIST-800-190, SLSA-L3"
spec:
  validationFailureAction: Enforce
  background: false
  rules:
    - name: require-image-digest
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [production]
      validate:
        message: "Image must use digest (@sha256:...), not mutable tags"
        foreach:
          - list: "request.object.spec.containers"
            deny:
              conditions:
                any:
                  - key: "{{ element.image }}"
                    operator: NotIn
                    value:
                      - "*@sha256:*"
---
# ── POLICY 3: REQUIRE RESOURCE LIMITS ────────────────────────
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-resource-limits
  annotations:
    security.policy/standard: "NSA-K8s-§3, CIS-EKS-5.2"
spec:
  validationFailureAction: Enforce
  background: false
  rules:
    - name: check-resource-limits
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [production, staging]
      validate:
        message: "All containers must have CPU and memory requests and limits"
        foreach:
          - list: "request.object.spec.containers"
            deny:
              conditions:
                any:
                  - key: "{{ element.resources.limits.cpu | length(@) }}"
                    operator: Equals
                    value: 0
                  - key: "{{ element.resources.limits.memory | length(@) }}"
                    operator: Equals
                    value: 0
                  - key: "{{ element.resources.requests.cpu | length(@) }}"
                    operator: Equals
                    value: 0
                  - key: "{{ element.resources.requests.memory | length(@) }}"
                    operator: Equals
                    value: 0
---
# ── POLICY 4: DENY PRIVILEGED CONTAINERS ─────────────────────
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: deny-privileged-containers
  annotations:
    security.policy/standard: "NSA-K8s-§3, CIS-EKS-5.2.1"
spec:
  validationFailureAction: Enforce
  background: false
  rules:
    - name: deny-privileged
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [production, staging]
      validate:
        message: "Privileged containers are not allowed"
        foreach:
          - list: "request.object.spec.containers"
            deny:
              conditions:
                any:
                  - key: "{{ element.securityContext.privileged || false }}"
                    operator: Equals
                    value: true
    - name: deny-host-namespaces
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [production, staging]
      validate:
        message: "hostNetwork, hostPID, hostIPC are not allowed"
        deny:
          conditions:
            any:
              - key: "{{ request.object.spec.hostNetwork || false }}"
                operator: Equals
                value: true
              - key: "{{ request.object.spec.hostPID || false }}"
                operator: Equals
                value: true
              - key: "{{ request.object.spec.hostIPC || false }}"
                operator: Equals
                value: true
    - name: deny-host-path
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [production, staging]
      validate:
        message: "hostPath volumes are not allowed"
        deny:
          conditions:
            any:
              - key: "{{ request.object.spec.volumes[?hostPath] | length(@) }}"
                operator: GreaterThan
                value: 0
---
# ── POLICY 5: ENFORCE SECURITY CONTEXT ───────────────────────
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: enforce-security-context
  annotations:
    security.policy/standard: "NSA-K8s-§3, NIST-800-207-T5"
spec:
  validationFailureAction: Enforce
  background: false
  rules:
    - name: enforce-container-security-context
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [production, staging]
      validate:
        message: "Containers must have proper securityContext"
        foreach:
          - list: "request.object.spec.containers"
            deny:
              conditions:
                any:
                  - key: "{{ element.securityContext.runAsNonRoot || false }}"
                    operator: NotEqual
                    value: true
                  - key: "{{ element.securityContext.allowPrivilegeEscalation || true }}"
                    operator: NotEqual
                    value: false
                  - key: "ALL"
                    operator: AnyNotIn
                    value: "{{ element.securityContext.capabilities.drop || '' }}"
    - name: enforce-pod-security-context
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [production, staging]
      validate:
        message: "Pod must have runAsNonRoot and RuntimeDefault seccomp profile"
        deny:
          conditions:
            any:
              - key: "{{ request.object.spec.securityContext.runAsNonRoot || false }}"
                operator: NotEqual
                value: true
              - key: "{{ request.object.spec.securityContext.seccompProfile.type || '' }}"
                operator: NotEqual
                value: "RuntimeDefault"
