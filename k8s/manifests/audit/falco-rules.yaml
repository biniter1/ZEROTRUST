driver:
  kind: ebpf
falcosidekick:
  enabled: false
customRules:
  online-boutique-rules.yaml: |-
    - rule: Shell spawned in container
      desc: Detect shell execution inside a container
      condition: >
        spawned_process and container
        and container.name != ""
        and proc.name in (shell_binaries)
        and not proc.pname in (shell_binaries)
      output: >
        Shell spawned in container (user=%user.name
        container=%container.name image=%container.image.repository
        shell=%proc.name parent=%proc.pname cmdline=%proc.cmdline)
      priority: WARNING
      tags: [container, shell, zerotrust]

    - rule: Sensitive file read in container
      desc: Detect reading of sensitive files inside containers
      condition: >
        open_read and container
        and fd.name in (/etc/shadow, /etc/passwd, /etc/sudoers,
        /root/.ssh/authorized_keys, /proc/1/environ)
      output: >
        Sensitive file read in container (user=%user.name
        file=%fd.name container=%container.name
        image=%container.image.repository)
      priority: ERROR
      tags: [container, filesystem, zerotrust]

    - rule: Write to unexpected directory in container
      desc: Container should only write to /tmp
      condition: >
        open_write and container
        and container.name in (frontend, cartservice, checkoutservice,
        paymentservice, productcatalogservice)
        and not fd.name startswith /tmp
        and not fd.name startswith /dev
        and not fd.name startswith /proc
      output: >
        Unexpected write in container (user=%user.name
        file=%fd.name container=%container.name
        image=%container.image.repository)
      priority: WARNING
      tags: [container, filesystem, zerotrust]
