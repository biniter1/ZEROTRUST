# ============================================================
# FLOW 2: K8s RBAC cho GitHub Actions deployer
# Chuẩn: NSA K8s Hardening Guide §5 · CIS EKS 5.1.x
# ============================================================

# ── Role cho namespace production ────────────────────────────
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gha-deployer-role
  namespace: production
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "serviceaccounts",
                "secrets", "configmaps", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gha-deployer-binding
  namespace: production
subjects:
  - kind: Group
    name: k8s-deployers
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: gha-deployer-role
  apiGroup: rbac.authorization.k8s.io
---
# ── Role cho namespace staging ────────────────────────────────
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gha-deployer-role
  namespace: staging
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "serviceaccounts",
                "secrets", "configmaps", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gha-deployer-binding
  namespace: staging
subjects:
  - kind: Group
    name: k8s-deployers
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: gha-deployer-role
  apiGroup: rbac.authorization.k8s.io
---
# ── ClusterRole: chỉ cho phép list/get namespaces ────────────
# Helm cần check namespace tồn tại không trước khi install
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gha-deployer-namespace-reader
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gha-deployer-namespace-binding
subjects:
  - kind: Group
    name: k8s-deployers
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: gha-deployer-namespace-reader
  apiGroup: rbac.authorization.k8s.io
