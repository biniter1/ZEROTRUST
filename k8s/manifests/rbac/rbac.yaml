# kind: ClusterRoleBinding
# metadata:
#   name: break-glass-admin
#   annotations:
#     security.note: "EMERGENCY USE ONLY — delete after use"
#     created-by: "ADMIN_NAME"
#     expires-at: "TIMESTAMP"
